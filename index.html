<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A lightweight tool formatting self-written blog posts taking care of linebreaks" />
  <meta name="keywords" content="Substack, blog post, linebreaks, mobile writing, lightweight tool" />
  <title>Substack writing formatter</title>
  <link rel="stylesheet" href="./styles/indexstyle.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header>
    <h1 id="title">Substack writer</h1>
    <nav id="lang-switcher">
      <button onclick="switchLang('de')" id="btn-de">DE</button>
      <button onclick="switchLang('en')" id="btn-en">EN</button>
    </nav>
    <nav>
      <button id="toggle-btn" onClick="togglePage();">
        <i data-lucide="align-left"></i>
      </button>
    </nav>
    <nav>
    <a href="https://github.com/DGrothe-PhD/substackwriter">GitHub</a>
    </nav>
  </header>

  <main>
  <h1 id="headline"></h1>
  <p id="advice"></p>
  <div class="flex-parent">
  <div class="card flex-child" >
    <div class="grid">
      <button id="prettify" onClick="prettify();">Prettify</button>
      <button id="removeEmpty" onClick="removeEmptyLines();">Remove empty lines</button>
      <button id="copyText" onclick="copyText()">Copy text</button>
      <button id="clearAll" onclick="clearAll()">Clear All</button>
    </div><br>
    <span id="feedback"></span>
    <textarea class="area" id="userinput" rows="20" ></textarea>
  </div>
  <div class="card flex-child" id="output"><p>nothingness</p>
  </div>
  </div>
  </main>

  <footer>
    &copy; 2026 D. Grothe
  </footer>
  <!--<script src="https://cdnjs.cloudflare.com/ajax/libs/i18next/25.5.2/i18next.min.js"></script>-->
    <script>
      if (typeof i18next === 'undefined') {
        document.write('<script src="./libs/cloudflare_i18next.min.js"><\/script>');
      }
    </script>
    <script src="./js/i18n-init.js"></script>
</body>
<script src="./formatter.js"></script>
</html>
